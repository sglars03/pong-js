<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel = "stylesheet" href = "styles.css">
</head>
<body>




    <main>

        <div class = "game-menu">
            <h1 class = "game-title">
                PONG <span class = "spam-title">by ale</span>
            </h1>

            <h3>Ingrese el nombre de los jugadores</h3>


            <div class = "labels">

                <label>
                    JUGADOR 1
                    <input type="text" id = "jugador-1-name">
                </label>

                <label>
                    JUGADOR 2
                    <input type="text" id = "jugador-2-name">
                </label>

            </div>


            <button class = "start-button">Iniciar</button>




        </div>

        <div class = 'game'>
            <canvas id = "myCanvas"></canvas>

            <div class = "info-container">

                <h2 class = "partidas">Partidas ganadas</h2>

                <div class = "partidas-jugadores">

                    <div class = "jugador_1_partidas">Jugador 1: <span>15</span></div>
                    <div class = "jugador_2_partidads">Jugador 2: <span>15</span></div>
                </div>

                <h2 class = "partidas">Goles</h2>
                <div class = "entradas-jugadores">
                    <div class = "jugador_1_entradas">Jugador 1: <span>15</span></div>
                    <div class = "jugador_2_entradas">Jugador 2: <span>15</span></div>
                </div>

            <button class = "pausar">PAUSAR</button>

        </div>

        


        </div>

    </main>









    <script src = "game.js"></script>

    
</body>
</html>
